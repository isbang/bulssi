<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e22">
<title>불씨</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #0b0e22; color: #f3ead8; overflow: hidden; position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }

  #hud { position: absolute; inset: 0; pointer-events: none; padding-top: calc(env(safe-area-inset-top) + 6px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #xpbar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  #xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5ad0ff, #7dffa0); }
  #hudrow { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; }
  #hudrow .side { width: 96px; font-size: 14px; }
  #timer { font-size: 20px; text-align: center; }
  #timer small { display: block; font-size: 10px; font-weight: 500; opacity: .7; }
  #pauseBtn { pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.12); font-size: 16px; float: right; }
  #bossbar { margin: 8px auto 0; max-width: 420px; }
  #bossbar b { display: block; font-size: 12px; text-align: center; color: #ff8aa0; text-shadow: 0 1px 3px #000; }
  #bossbar div { height: 8px; border-radius: 4px; background: rgba(0,0,0,.5); overflow: hidden; margin-top: 3px; }
  #bossbar i { display: block; height: 100%; background: #ff5a7a; }
  #toast { margin: 14px auto 0; max-width: 340px; padding: 9px 14px; border-radius: 12px; background: rgba(10,12,28,.85); border: 1px solid rgba(255,255,255,.14); font-size: 13px; text-align: center; line-height: 1.45; opacity: 0; transition: opacity .3s; }
  #toast.show { opacity: 1; }

  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; touch-action: pan-y;
    padding-block: calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-bottom) + 20px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .screen > * { width: 100%; max-width: 420px; flex-shrink: 0; }
  .dim { background: rgba(6,8,20,.82); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); justify-content: center; }
  .dim.top { justify-content: flex-start; }
  h1 { margin: 6vh 0 0; font-size: 56px; text-align: center; letter-spacing: 6px; color: #ffb347; text-shadow: 0 0 28px rgba(255,122,26,.8); }
  h2 { margin: 0 0 14px; font-size: 24px; text-align: center; }
  .sub { margin: 4px 0 22px; text-align: center; opacity: .7; font-size: 14px; }
  .chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chars button { padding: 10px 2px 8px; border-radius: 14px; background: rgba(255,255,255,.07); border: 2px solid transparent; font-size: 11px; }
  .chars button span { display: block; font-size: 26px; line-height: 1.3; }
  .chars button.sel { border-color: #ffb347; background: rgba(255,179,71,.16); }
  .chars button.locked span { filter: grayscale(1) brightness(.5); }
  .panel { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.06); font-size: 13px; line-height: 1.55; min-height: 66px; }
  .panel b { font-size: 15px; color: #ffcf8a; }
  .row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; font-size: 14px; }
  .row button { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); font-size: 20px; }
  .primary { margin-top: 16px; padding: 16px; border-radius: 16px; background: linear-gradient(180deg, #ffb347, #ff7a1a); color: #2a1200; font-size: 18px; font-weight: 800; box-shadow: 0 6px 24px rgba(255,122,26,.4); }
  .primary:disabled { filter: grayscale(1); opacity: .5; box-shadow: none; }
  .ghost { margin-top: 10px; padding: 13px; border-radius: 14px; background: rgba(255,255,255,.09); font-size: 15px; }
  .records { display: flex; justify-content: space-around; margin-top: 18px; font-size: 12px; opacity: .8; text-align: center; }
  .records b { display: block; font-size: 17px; color: #ffcf8a; }
  .help { margin: 16px 0 0; text-align: center; font-size: 12px; opacity: .6; line-height: 1.6; }

  .cards { display: flex; flex-direction: column; gap: 10px; }
  .cards.locked { pointer-events: none; }
  .card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; text-align: left; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .card:active { background: rgba(255,179,71,.22); }
  .card .ic { font-size: 30px; width: 40px; text-align: center; flex-shrink: 0; }
  .card .nm { font-size: 16px; font-weight: 700; }
  .card .tag { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 8px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.14); vertical-align: 2px; }
  .card .tag.new { background: #5ad0ff; color: #04202c; }
  .card .tag.awk { background: #ffd75a; color: #3a2a00; }
  .card .tag.relic { background: #c79bff; color: #22083c; }
  .card .ds { margin-top: 3px; font-size: 13px; opacity: .8; line-height: 1.4; }
  .build { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .build span { padding: 5px 9px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 12px; }
  .label { margin: 12px 0 6px; font-size: 11px; opacity: .55; letter-spacing: 1px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; font-size: 12px; opacity: .9; }
  .stats b { display: block; font-size: 22px; color: #ffcf8a; }
  .unlock { margin-top: 12px; padding: 10px; border-radius: 12px; background: rgba(125,255,160,.12); border: 1px solid rgba(125,255,160,.4); font-size: 13px; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><i></i></div>
  <div id="hudrow">
    <div class="side"><span id="lvl"></span><br><span id="kills"></span></div>
    <div id="timer"></div>
    <div class="side"><button id="pauseBtn" aria-label="일시정지">Ⅱ</button></div>
  </div>
  <div id="bossbar" class="hidden"><b></b><div><i></i></div></div>
  <div id="toast"></div>
</div>

<div id="menu" class="screen">
  <h1>불씨</h1>
  <p class="sub">긴 밤을 버텨 새벽을 맞이하라</p>
  <div id="chars" class="chars"></div>
  <div id="charInfo" class="panel"></div>
  <div id="depthRow" class="row hidden"><button id="depthDown">−</button><span id="depthLabel"></span><button id="depthUp">+</button></div>
  <button id="startBtn" class="primary">밤으로 나서기</button>
  <div id="records" class="records"></div>
  <p class="help">화면 아무 곳이나 누른 채 끌면 이동 · 공격은 자동<br>한 판 12~15분 · 매일 밤 다른 징조가 찾아온다</p>
  <button id="soundBtn" class="ghost"></button>
</div>

<div id="choice" class="screen dim hidden">
  <h2 id="choiceTitle"></h2>
  <div id="cards" class="cards"></div>
  <button id="rerollBtn" class="ghost"></button>
</div>

<div id="pause" class="screen dim top hidden">
  <h2>잠시 멈춤</h2>
  <div id="pauseBody"></div>
  <button id="resumeBtn" class="primary">계속하기</button>
  <button id="pauseSoundBtn" class="ghost"></button>
  <button id="quitBtn" class="ghost">이번 밤 포기하기</button>
</div>

<div id="over" class="screen dim hidden">
  <h2 id="overTitle"></h2>
  <p id="overSub" class="sub"></p>
  <div id="overStats" class="stats"></div>
  <div id="overUnlock"></div>
  <button id="retryBtn" class="primary">다시 도전</button>
  <button id="menuBtn" class="ghost">처음 화면으로</button>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
