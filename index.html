<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1020">
<meta name="apple-mobile-web-app-title" content="불씨">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Song+Myung&display=swap">
<title>불씨</title>
<style>
  /* 평평한 면과 가는 선, 낙관 도장. 빛나는 것은 게임 속 불뿐이다. */
  :root {
    color-scheme: dark;
    --ink: #0d1020; --night: #161b38; --line: #2e3560; --paper: #ece3cf; --dim: #9b9bb0;
    --ember: #f08a2e; --ember-deep: #a84d16; --jade: #74c7a4; --gold: #e3ba52; --rose: #e2607a; --sky: #6cb6e6;
    --disp: "Song Myung", "Nanum Myeongjo", "AppleMyungjo", serif;
    --body: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden; position: relative;
    font-family: var(--body); font-size: 15px; line-height: 1.55;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  h1, h2, h3, p, dl, dd { margin: 0; }

  .seal {
    display: inline-grid; place-items: center; flex-shrink: 0; width: 40px; height: 40px; border-radius: 3px;
    font-family: var(--disp); font-size: 25px; line-height: 1; color: var(--ink); background: var(--ember);
  }
  .seal.p { background: var(--jade); }
  .seal.r { background: var(--gold); }
  .seal.h { background: var(--rose); }
  .seal.sm { width: 26px; height: 26px; font-size: 16px; }

  #hud { position: absolute; inset: 0; pointer-events: none; padding-top: calc(env(safe-area-inset-top) + 6px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #xpbar { height: 5px; background: var(--line); }
  #xpbar i { display: block; height: 100%; width: 0; background: var(--sky); }
  #hudrow { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 8px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px var(--ink); }
  #hudrow .side { width: 88px; font-size: 13px; line-height: 1.4; }
  #kills { color: var(--dim); }
  #timer { font-family: var(--disp); font-size: 28px; line-height: 1; text-align: center; }
  #timer small { display: block; margin-bottom: 4px; font-family: var(--body); font-size: 11px; color: var(--dim); }
  #pauseBtn { pointer-events: auto; float: right; width: 44px; height: 44px; display: grid; place-content: center; grid-auto-flow: column; gap: 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--ink); }
  #pauseBtn::before, #pauseBtn::after { content: ""; width: 4px; height: 14px; background: var(--paper); }
  #bossbar { margin: 10px auto 0; max-width: 420px; }
  #bossbar b { display: block; font-family: var(--disp); font-weight: 400; font-size: 15px; text-align: center; color: var(--rose); text-shadow: 0 1px 2px var(--ink); }
  #bossbar div { height: 6px; margin-top: 4px; background: var(--line); }
  #bossbar i { display: block; height: 100%; background: var(--rose); }
  #toast { margin: 14px auto 0; max-width: 320px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 4px; background: rgba(13,16,32,.92); font-size: 13px; text-align: center; opacity: 0; transition: opacity .25s; }
  #toast.show { opacity: 1; }
  #toast small { display: block; font-size: 11px; color: var(--dim); }
  #toast b { display: block; font-family: var(--disp); font-weight: 400; font-size: 20px; color: var(--ember); }

  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; touch-action: pan-y;
    padding-block: calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-bottom) + 20px);
    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .screen > * { width: 100%; max-width: 400px; flex-shrink: 0; }
  .dim { background: rgba(13,16,32,.97); justify-content: center; }
  .dim.top { justify-content: flex-start; }

  .title { margin-top: 5vh; }
  h1 { font-family: var(--disp); font-weight: 400; font-size: 88px; line-height: 1; letter-spacing: -2px; }
  h1::after { content: ""; display: inline-block; width: 14px; height: 14px; margin-left: 8px; background: var(--ember); }
  .title p { margin-top: 10px; color: var(--dim); }
  h2 { font-family: var(--disp); font-weight: 400; font-size: 32px; line-height: 1.2; }
  h2 + p { margin-top: 4px; color: var(--dim); font-size: 14px; }
  h3 { font-family: var(--disp); font-weight: 400; font-size: 20px; }

  .chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 28px; }
  .char { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 7px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; }
  .char.sel { border-color: var(--ember); background: var(--night); }
  .char.locked { color: var(--dim); }
  .char.locked .seal { background: none; color: var(--line); box-shadow: inset 0 0 0 1px var(--line); }
  .info { margin-top: 14px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 112px; font-size: 14px; }
  .info p { color: var(--dim); }
  .info .wp { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
  .info .wp b { color: var(--paper); font-weight: 400; margin-right: 4px; }
  .depth { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 14px; }
  .depth button { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 4px; font-size: 20px; line-height: 1; }

  .btn { display: block; margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 4px; font-size: 16px; text-align: center; }
  .btn:active { background: var(--night); }
  .btn.primary { margin-top: 22px; border: 0; background: var(--ember); color: #1d0e02; font-weight: 700; font-size: 17px; box-shadow: 0 4px 0 var(--ember-deep); }
  .btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ember-deep); background: var(--ember); }
  .btn.primary:disabled { background: var(--line); color: var(--dim); box-shadow: none; transform: none; }
  .link { margin-top: 14px; padding: 8px; font-size: 13px; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }

  .records { display: flex; margin-top: 26px; }
  .records div { flex: 1; padding-left: 12px; border-left: 1px solid var(--line); }
  .records dt { font-size: 11px; color: var(--dim); }
  .records dd { font-family: var(--disp); font-size: 24px; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .help { margin-top: 20px; font-size: 13px; color: var(--dim); }

  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .cards.locked { pointer-events: none; }
  .card { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--night); text-align: left; }
  .card:active { border-color: var(--ember); }
  .card > div { min-width: 0; }
  .card .nm { font-size: 16px; }
  .card .tag { margin-left: 8px; font-size: 12px; color: var(--dim); }
  .card .tag.new { color: var(--sky); }
  .card .tag.awk { color: var(--ember); }
  .card .tag.relic { color: var(--gold); }
  .card .ds { font-size: 13px; color: var(--dim); line-height: 1.45; }

  .label { margin: 16px 0 6px; font-size: 11px; color: var(--dim); }
  .build { display: flex; flex-wrap: wrap; gap: 6px; }
  .build span { padding: 4px 8px; border: 1px solid var(--line); border-radius: 3px; font-size: 13px; }
  .build i { font-style: normal; color: var(--dim); margin-left: 4px; }
  #pause .info { min-height: 0; margin-top: 16px; }
  #over .records { margin-top: 22px; }
  .unlock { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--jade); }

  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } .btn.primary:active { transform: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><i></i></div>
  <div id="hudrow">
    <div class="side"><div id="lvl"></div><div id="kills"></div></div>
    <div id="timer"></div>
    <div class="side"><button id="pauseBtn" aria-label="일시정지"></button></div>
  </div>
  <div id="bossbar" class="hidden"><b></b><div><i></i></div></div>
  <div id="toast"></div>
</div>

<div id="menu" class="screen">
  <header class="title">
    <h1>불씨</h1>
    <p>밤은 길고, 불은 작다.</p>
  </header>
  <div id="chars" class="chars"></div>
  <div id="charInfo" class="info"></div>
  <div id="depthRow" class="depth hidden"><button id="depthDown" aria-label="한 단계 얕게">−</button><span id="depthLabel"></span><button id="depthUp" aria-label="한 단계 깊게">+</button></div>
  <button id="startBtn" class="btn primary">밤길 나서기</button>
  <dl id="records" class="records"></dl>
  <p class="help">누른 채 끌면 움직인다. 공격은 저절로 나간다.</p>
  <button id="soundBtn" class="link"></button>
</div>

<div id="choice" class="screen dim hidden">
  <h2 id="choiceTitle"></h2>
  <p>하나를 고른다.</p>
  <div id="cards" class="cards"></div>
  <button id="rerollBtn" class="btn"></button>
</div>

<div id="pause" class="screen dim top hidden">
  <h2>잠시 멈춤</h2>
  <div id="pauseBody"></div>
  <button id="resumeBtn" class="btn primary">계속</button>
  <button id="quitBtn" class="btn">그만두기</button>
  <button id="pauseSoundBtn" class="link"></button>
</div>

<div id="over" class="screen dim hidden">
  <h2 id="overTitle"></h2>
  <p id="overSub"></p>
  <dl id="overStats" class="records"></dl>
  <div id="overUnlock"></div>
  <button id="retryBtn" class="btn primary">한 번 더</button>
  <button id="menuBtn" class="btn">처음으로</button>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
